<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hikmah has moved</title><meta name="robots" content="noindex"><meta name="theme-color" content="#F6F4FB">
<style>body{font:16px/1.5 system-ui,sans-serif;background:#F6F4FB;color:#1b1830;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}a{color:#6D4AFF;font-weight:700}</style>
<script>
/* Hikmah now has its own address. Bring this device's progress along once, then forward. */
(function(){
  var NEW="https://hikmah-sadiq.github.io/";
  var dest=(location.hash&&location.hash.length>1&&location.hash.indexOf("#import=")!==0)?location.hash.slice(1):"home";
  var keys={},n=0;
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
    if(k&&k.indexOf("hikmah:")===0&&k!=="hikmah:_gtok"&&k!=="hikmah:_errs"&&k!=="hikmah:_others"){keys[k.slice(7)]=localStorage.getItem(k);n++}}}catch(e){}
  var url=NEW+"#"+dest;
  if(n){try{var b=btoa(unescape(encodeURIComponent(JSON.stringify({v:1,keys:keys})))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    if(b.length<1500000)url=NEW+"#import="+b+"&then="+encodeURIComponent(dest);}catch(e){}}
  var go=function(){location.replace(url)};
  var tasks=[];
  try{if(navigator.serviceWorker)tasks.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.filter(function(r){return /\/hikmah\/$/.test(r.scope)}).map(function(r){return r.unregister()}))}))}catch(e){}
  try{if(window.caches)tasks.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf("hikmah-")===0}).map(function(k){return caches.delete(k)}))}))}catch(e){}
  Promise.race([Promise.all(tasks),new Promise(function(r){setTimeout(r,1500)})]).then(go,go);
})();
</script></head>
<body><div><h1 style="font-size:22px">Hikmah has a new home</h1><p>Taking you there with your progress…</p>
<p><a href="https://hikmah-sadiq.github.io/">Open Hikmah</a></p></div></body></html>
